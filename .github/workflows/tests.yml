name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build Docker sandbox image
        run: |
          docker build -t sprints-python-sandbox:latest -f sandbox/Dockerfile .

      - name: Run Pytest test suite
        run: |
          set -o pipefail
          pytest -v --tb=short 2>&1 | tee pytest_output.txt

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f pytest_output.txt ]; then
            echo "### Test Execution Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 pytest_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-execution-log
          path: pytest_output.txt
